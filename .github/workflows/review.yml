name: kodi-review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true
        type: string
      repo:
        description: "Repository the pull request is in"
        required: false
        type: string
        default: xbmc/xbmc
      sha:
        description: "Blind replay: review the PR at this commit, without discussion or status"
        required: false
        type: string
      effort:
        description: "Reasoning effort"
        required: false
        type: choice
        default: high
        options: [high, medium]
      dry_run:
        description: "Write the review to the run summary instead of posting it"
        required: false
        type: boolean
        default: false
      comment:
        description: "Comment that asked for the review, as issue/ID or review/ID"
        required: false
        type: string
      mode:
        description: "Set by the relay: answer runs each get their own queue, reviews share one"
        required: false
        type: string

concurrency:
  group: >-
    kodi-review-${{ inputs.repo }}-${{ inputs.pr }}-${{ inputs.mode == 'answer' && inputs.comment
    || 'review' }}
  cancel-in-progress: false

env:
  UPSTREAM: ${{ inputs.repo || 'xbmc/xbmc' }}
  REVIEW_REPO: ${{ inputs.repo || 'xbmc/xbmc' }}
  UPSTREAM_PR: ${{ inputs.pr }}
  FORK_PR: ${{ inputs.pr }}
  REPLAY_SHA: ${{ inputs.sha }}
  COMMENT: ${{ inputs.comment }}

jobs:
  trigger:
    if: github.repository_owner == 'MikeSiLVO' && inputs.comment != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.check.outcome == 'success' }}
      mode: ${{ steps.check.outputs.mode }}
    steps:
      - name: Check out the review bot
        uses: actions/checkout@v6
        with:
          path: bot
          persist-credentials: false

      - name: Split the repository name
        id: target
        run: |
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || { echo "Not a repo: $UPSTREAM"; exit 1; }
          echo "owner=${UPSTREAM%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${UPSTREAM#*/}" >> "$GITHUB_OUTPUT"

      - name: Get an App token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KODI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.KODI_REVIEW_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-pull-requests: write

      - name: Check the comment that asked for the bot
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: python3 bot/review.py trigger

  review:
    needs: trigger
    if: >-
      github.repository_owner == 'MikeSiLVO' && !cancelled()
      && (inputs.comment == '' || needs.trigger.outputs.allowed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      prepared: ${{ steps.prep.outputs.prepared }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      BOT: .kodi-review-bot
      MODE: ${{ needs.trigger.outputs.mode || 'review' }}
    steps:
      - name: Find the commits to review
        id: refs
        run: |
          set -euo pipefail
          [[ "$UPSTREAM_PR" =~ ^[0-9]+$ ]] || { echo "Not a PR number: $UPSTREAM_PR"; exit 1; }
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] \
            || { echo "Not a repo: $UPSTREAM"; exit 1; }
          meta=$(gh api "repos/$UPSTREAM/pulls/$UPSTREAM_PR")
          [[ "$(jq -r .state <<<"$meta")" == open ]] \
            || { echo "PR $UPSTREAM_PR is not open; nothing to review."; exit 1; }
          if [ -n "$REPLAY_SHA" ]; then
            [[ "$REPLAY_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "Not a commit: $REPLAY_SHA"; exit 1; }
            head_sha=$(gh api "repos/$UPSTREAM/commits/$REPLAY_SHA" --jq .sha)
          else
            head_sha=$(jq -r .head.sha <<<"$meta")
          fi
          base_sha=$(gh api "repos/$UPSTREAM/compare/$(jq -r .base.ref <<<"$meta")...$head_sha" \
            --jq .merge_base_commit.sha)
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the pull request code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ steps.refs.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Remove agent config from the pull request code
        run: |
          rm -rf .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md \
            CLAUDE.local.md .husky .kodi-review-run .kodi-review-bot
          find . -path ./.git -prune -o \( -name .claude -o -name CLAUDE.md \
            -o -name CLAUDE.local.md -o -name AGENTS.md \) -prune -exec rm -rf {} +

      - name: Check out the review bot
        uses: actions/checkout@v6
        with:
          path: .kodi-review-bot
          persist-credentials: false

      - name: Prepare the review inputs
        id: prep
        env:
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p .kodi-review-run
          python3 "$BOT/review.py" pr
          if [ "$MODE" = answer ]; then python3 "$BOT/review.py" question; fi
          if [ -z "$REPLAY_SHA" ]; then
            python3 "$BOT/review.py" status || echo "Status unavailable"
            original=$(jq -r '.backport.original // empty' .kodi-review-run/status.json || true)
            if [ -n "$original" ]; then
              gh api -H "Accept: application/vnd.github.diff" "repos/$UPSTREAM/pulls/$original" \
                > .kodi-review-run/original.diff || rm -f .kodi-review-run/original.diff
            fi
            python3 "$BOT/review.py" discussion || echo "Discussion unavailable"
            gh pr diff "$UPSTREAM_PR" --repo "$UPSTREAM" > .kodi-review-run/full.diff
            prev=$(python3 "$BOT/review.py" prev)
            python3 "$BOT/review.py" prior || echo "Earlier findings unavailable"
            compare="repos/$UPSTREAM/compare/$prev...$HEAD_SHA"
            if [ -n "$prev" ] && [ "$prev" != "$HEAD_SHA" ] \
                && [ "$(gh api "$compare" --jq .status || true)" = ahead ]; then
              gh api -H "Accept: application/vnd.github.diff" "$compare" \
                > .kodi-review-run/new.diff || rm -f .kodi-review-run/new.diff
            fi
          else
            gh api -H "Accept: application/vnd.github.diff" \
              "repos/$UPSTREAM/compare/$BASE_SHA...$HEAD_SHA" > .kodi-review-run/full.diff
          fi
          for rules in AGENTS.md docs/CODE_GUIDELINES.md; do
            out=".kodi-review-run/$(basename "$rules")"
            gh api -H "Accept: application/vnd.github.raw" \
              "repos/$UPSTREAM/contents/$rules?ref=$BASE_SHA" > "$out" || rm -f "$out"
          done
          python3 "$BOT/review.py" piers
          if [ "$MODE" = answer ]; then
            cat "$BOT/ANSWER.md" "$BOT/REVIEW.md" > "$RUNNER_TEMP/instructions.md"
            echo "schema=$(jq -c . "$BOT/answer.json")" >> "$GITHUB_OUTPUT"
            echo "task=Answer the question in question.md about" >> "$GITHUB_OUTPUT"
          else
            cp "$BOT/REVIEW.md" "$RUNNER_TEMP/instructions.md"
            echo "schema=$(jq -c . "$BOT/schema.json")" >> "$GITHUB_OUTPUT"
            echo "task=Review" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$(cd .kodi-review-run && ls -dp -- * | paste -sd' ')" >> "$GITHUB_OUTPUT"
          echo "prepared=true" >> "$GITHUB_OUTPUT"

      - name: Install bubblewrap for the subprocess env scrub
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat

      - name: Review
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: '{"permissions": {"blockReadsOutsideWorkingDirectories": true}}'
          prompt: |
            ${{ steps.prep.outputs.task }} pull request ${{ inputs.pr }} in ${{ env.UPSTREAM }}.
            Follow the instructions in your system prompt. The prepared files in
            .kodi-review-run are: ${{ steps.prep.outputs.files }}. Read the ones your
            instructions name in your first turn, then return the result in the required
            structured format.
          claude_args: |
            --model claude-opus-5-5
            --effort ${{ inputs.effort || 'high' }}
            --max-turns ${{ env.MODE == 'answer' && 20 || 60 }}
            --append-system-prompt-file ${{ runner.temp }}/instructions.md
            --permission-mode dontAsk
            --tools "Read,Grep,Glob"
            --allowedTools "Read(./**)" "Grep(./**)" "Glob(./**)"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Read(~/.claude/**)"
            --disallowedTools "Read(./.git/**)"
            --json-schema '${{ steps.prep.outputs.schema }}'

      - name: Token use
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: python3 "$BOT/review.py" usage "$EXECUTION_FILE" || true

      - name: Keep the result for the post job
        if: always() && steps.prep.outcome == 'success'
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: printf '%s' "$RESULT" > .kodi-review-run/result.json

      - name: Hand the result to the post job
        if: always() && steps.prep.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: review
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: warn
          path: |
            .kodi-review-run/result.json
            .kodi-review-run/status.json
            .kodi-review-run/prior.json
            .kodi-review-run/new.diff
            .kodi-review-run/question.json

  post:
    needs: [trigger, review]
    if: always() && needs.review.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ needs.review.outputs.head_sha }}
      MODE: ${{ needs.trigger.outputs.mode || 'review' }}
    steps:
      - name: Check out the review bot
        uses: actions/checkout@v6
        with:
          path: bot
          persist-credentials: false

      - name: Get the review result
        uses: actions/download-artifact@v8
        with:
          name: review
          path: .kodi-review-run

      - name: Write the review to the run summary
        if: env.MODE == 'review' && (inputs.dry_run || inputs.sha != '')
        run: |
          python3 bot/review.py render .kodi-review-run/status.json .kodi-review-run/result.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Split the repository name
        id: target
        if: ${{ !inputs.dry_run && inputs.sha == '' }}
        run: |
          echo "owner=${UPSTREAM%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${UPSTREAM#*/}" >> "$GITHUB_OUTPUT"

      - name: Get an App token
        id: app
        if: ${{ !inputs.dry_run && inputs.sha == '' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.KODI_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.KODI_REVIEW_APP_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-pull-requests: write

      - name: Post the review or the answer
        if: ${{ !inputs.dry_run && inputs.sha == '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          RESULT=$(cat .kodi-review-run/result.json) python3 bot/review.py \
            "$([ "$MODE" = answer ] && echo reply || echo post)"
