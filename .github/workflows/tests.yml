name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyright==1.1.411 ruff==0.16.6
      - run: python -m unittest -v test_review test_skin
      - run: ruff check .
      - run: pyright review.py test_review.py skin.py test_skin.py kdkcheck.py
      - run: node --test relay/worker.test.mjs
