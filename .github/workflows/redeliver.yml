name: redeliver

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List the deliveries to replay without replaying them"
        type: boolean
        default: false

concurrency:
  group: redeliver
  cancel-in-progress: false

jobs:
  redeliver:
    if: github.repository == 'MikeSiLVO/kodi-review'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replay the App's recent webhook deliveries that never got through
        env:
          APP_CLIENT_ID: ${{ vars.KODI_REVIEW_CLIENT_ID }}
          APP_KEY: ${{ secrets.KODI_REVIEW_APP_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 redeliver.py
