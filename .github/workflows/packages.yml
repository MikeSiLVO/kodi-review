name: pinned packages

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare the pinned packages with Ubuntu's current ones
        run: |
          sudo apt-get update -qq
          stale=0
          for deb in vendor/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            pinned=$(dpkg-deb -f "$deb" Version)
            current=$(apt-cache policy "$name" | awk '/Candidate:/ {print $2}')
            if dpkg --compare-versions "$current" gt "$pinned"; then
              echo "::error::$name $pinned is pinned, Ubuntu 24.04 has $current"
              stale=1
            else
              echo "$name $pinned is current"
            fi
          done
          exit "$stale"
