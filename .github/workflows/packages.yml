name: pinned packages

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the pinned packages with Ubuntu's current ones
        run: |
          sudo apt-get update -qq
          stale=0
          for deb in vendor/*.deb; do
            name=$(dpkg-deb -f "$deb" Package)
            pinned=$(dpkg-deb -f "$deb" Version)
            current=$(apt-cache policy "$name" | awk '/Candidate:/ {print $2}')
            if dpkg --compare-versions "$current" gt "$pinned"; then
              echo "::error::$name $pinned is pinned, Ubuntu 24.04 has $current"
              stale=1
            else
              echo "$name $pinned is current"
            fi
          done
          exit "$stale"

      - name: Compare the pinned clang-format with PyPI's newest
        if: always()
        run: |
          pinned=$(sed -n 's/^clang-format==\([^ ]*\).*/\1/p' vendor/clang-format.txt)
          newest=$(curl -fsS https://pypi.org/pypi/clang-format/json | jq -r .info.version)
          if [ "$pinned" != "$newest" ]; then
            echo "::error::clang-format $pinned is pinned, PyPI has $newest"
            exit 1
          fi
          echo "clang-format $pinned is current"
