name: kodi-review read canary

on:
  workflow_dispatch:

env:
  SCHEMA: '{"type":"object","additionalProperties":false,"required":["hostname","environ","gitconfig","claude_settings","runner_temp","readme","grep_git"],"properties":{"hostname":{"type":"string","enum":["READABLE","DENIED"]},"environ":{"type":"string","enum":["READABLE","DENIED"]},"gitconfig":{"type":"string","enum":["READABLE","DENIED"]},"claude_settings":{"type":"string","enum":["READABLE","DENIED"]},"runner_temp":{"type":"string","enum":["READABLE","DENIED"]},"readme":{"type":"string","enum":["READABLE","DENIED"]},"grep_git":{"type":"string","enum":["READABLE","DENIED"]}}}'

jobs:
  canary:
    if: github.repository_owner == 'MikeSiLVO'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install bubblewrap and socat
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat

      - name: Try the reads
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Use the Read tool once on each path below, then Grep for "x-access-token" in ./.git.
            Report each as READABLE or DENIED only. Never write any file content.
            hostname: /etc/hostname, environ: /proc/self/environ, gitconfig: ./.git/config,
            claude_settings: ~/.claude/settings.json, runner_temp: /home/runner/work/_temp/,
            readme: ./README.md, grep_git: the Grep in ./.git
          claude_args: |
            --model claude-haiku-4-5-20251001
            --max-turns 15
            --allowedTools "Read(./**)" "Grep(./**)" "Glob(./**)"
            --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"
            --disallowedTools "Read(//proc/**)" "Read(//sys/**)" "Read(~/.claude/**)"
            --disallowedTools "Read(./.git/**)"
            --json-schema '${{ env.SCHEMA }}'

      - name: Report
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
        run: |
          echo "Claude reported: $RESULT"
          echo "Token entries in .git/config: $(grep -c 'x-access-token' .git/config || true)"
